[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycaas"
version = "0.1.0"
description = "Python Camera as a Service — discover, capture, and serve camera frames over ZMQ"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Younghyo Park"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    # The contrib build, as aprilcube uses: two OpenCV wheels in one environment both install cv2.
    "opencv-contrib-python>=4.8,<5",
    "pyzmq>=25.0",
    "numpy>=1.24",
    "click>=8.0",
]

[project.optional-dependencies]
realsense = ["pyrealsense2>=2.50"]
oak = ["depthai>=2.24"]
all = ["pycaas[realsense,oak]"]

[project.scripts]
pycaas = "pycaas.cli:main"

[project.urls]
Homepage = "https://github.com/younghyopark/pycaas"
Repository = "https://github.com/younghyopark/pycaas"

[tool.setuptools.packages.find]
where = ["src"]
