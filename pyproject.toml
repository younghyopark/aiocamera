[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycaas"
version = "0.1.0"
description = "Python Camera as a Service — discover, capture, and serve camera frames over ZMQ"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "pyzmq>=25.0",
    "numpy>=1.24",
    "click>=8.0",
]

[project.optional-dependencies]
realsense = ["pyrealsense2>=2.50"]
oak = ["depthai>=2.24"]
all = ["pycaas[realsense,oak]"]

[project.scripts]
pycaas = "pycaas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
