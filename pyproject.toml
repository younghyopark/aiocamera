[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aiocamera"
version = "0.1.2"
description = "Camera as a service — discover, capture, and serve camera frames over ZMQ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Younghyo Park"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    # The contrib build, as aprilcube uses: two OpenCV wheels in one environment both install cv2.
    "opencv-contrib-python>=4.8,<5",
    "pyzmq>=25.0",
    "numpy>=1.24",
    "click>=8.0",
]

[project.optional-dependencies]
# Intel publishes no macOS wheels; pyrealsense2-macosx builds the same pyrealsense2 module for macOS.
realsense = [
    "pyrealsense2>=2.50; sys_platform != 'darwin'",
    "pyrealsense2-macosx>=2.50; sys_platform == 'darwin'",
]
oak = ["depthai>=2.24"]
all = ["aiocamera[realsense,oak]"]

[project.scripts]
aiocamera = "aiocamera.cli:main"

[project.urls]
Homepage = "https://github.com/younghyopark/aiocamera"
Repository = "https://github.com/younghyopark/aiocamera"

[tool.setuptools.packages.find]
where = ["src"]
